name: build
author: aliontory
description: >-
  유니티 게임을 빌드하여, 이름이 artifactName인 아티팩트로 업로드한다.
  빌드된 실행 파일은 아티팩트 루트에서 executionFileName.(확장자) 라는 이름으로 생성된다.
  실행 파일의 확장자는, targetPlatform이
    - StandaloneWindows64일 경우: executionFileName.exe
  로 정해진다.
inputs: 
  unityLicense:
    description: 'https://game.ci/docs/github/activation 참고'
    required: true
  unityEmail:
    description: 'https://game.ci/docs/github/activation 참고'
    required: true
  unityPassword:
    description: 'https://game.ci/docs/github/activation 참고'
    required: true
  targetPlatform:
    description: '빌드 대상 플랫폼의 이름. 허용되는 값 목록은 https://docs.unity3d.com/ScriptReference/BuildTarget.html 참고.'
    required: true
  buildProfile:
    description: 'targetPlatform에 대응하는 유니티 Build Profile 에셋 경로'
    required: true
  executionFileName:
    description: '빌드 결과 실행 파일의 이름을 지정. 확장자 미포함'
    required: false
    default: 'Yggdrasill'
  artifactName:
    description: '빌드 결과물을 업로드할 아티팩트 이름'
    required: true
outputs:
  buildVersion: 
    value: ${{ steps.buildStep.outputs.buildVersion }}
    description: 'game-ci 액션이 생성한 게임 빌드 버전. https://game.ci/docs/github/builder#versioning 참고'
runs:
  using: composite
  steps:
    - name: Setup Unity
      uses: ./.github/actions/setup-unity
    # 빌드된 실행 파일이 build/targetPlatform/buildName.exe.or.app.etc 경로에 생성됨.
    - name: Build
      uses: game-ci/unity-builder@v4
      id: buildStep
      env:
        UNITY_LICENSE: ${{ inputs.unityLicense }}
        UNITY_EMAIL: ${{ inputs.unityEmail }}
        UNITY_PASSWORD: ${{ inputs.unityPassword }}
      with:
        targetPlatform: ${{ inputs.targetPlatform }}
        buildProfile: ${{ inputs.buildProfile }}
        buildName: ${{ inputs.executionFileName }}
        versioning: Semantic

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifactName }}
        path: build/${{ inputs.targetPlatform }}
        retention-days: 7
        if-no-files-found: error
